<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RDCJ | Editar Processo</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="page-content"><a class="text-link" href="matriz.html">← Voltar para a matriz</a><section class="card edit-card"><p class="page-kicker">Edição auditável</p><h1 class="page-title">Editar Processo</h1><p class="section-caption" data-readonly></p><form data-edit-form><label>Responsável<input name="responsavel"></label><label>Advogado<input name="advogado"></label><label>Status<input name="status"></label><label>Comentário executivo<textarea name="comentarioExecutivo"></textarea></label><label>Observação<textarea name="observacao"></textarea></label><label>Data próxima revisão<input type="date" name="dataProximaRevisao"></label><label>Prioridade<input name="prioridade"></label><button class="button" type="submit">Salvar alterações</button></form><p data-status></p></section></main><script src="../js/auditoria.js"></script><script src="../js/base-manager.js"></script><script src="../js/processo-repository.js"></script><script>const cnj=new URLSearchParams(location.search).get('cnj');const processo=rdcjProcessoRepository.buscarPorCnj(cnj);const form=document.querySelector('[data-edit-form]');if(!processo){document.querySelector('[data-status]').textContent='Processo não encontrado.';form.hidden=true;}else{document.querySelector('[data-readonly]').textContent=`CNJ: ${processo.cnj} · Cliente: ${processo.cliente} · Valor: ${processo.valor} · Data da decisão: ${processo.dataDecisao || 'não informada'} · Importação: ${processo.dataImportacao || 'não informada'} · Versão: ${processo.versaoCarga || 'não informada'}`;for(const campo of form.elements){if(campo.name)campo.value=processo[campo.name] || '';}form.addEventListener('submit',(evento)=>{evento.preventDefault();const alteracoes=Object.fromEntries(new FormData(form));rdcjProcessoRepository.salvar({...processo,...alteracoes,ultimaEdicao:new Date().toISOString(),ultimoEditor:'usuário local'});rdcjAuditoria.registrar({tipo:'EDICAO_PROCESSO',usuario:'usuário local',cnj,detalhes:Object.keys(alteracoes).join(', ')});document.querySelector('[data-status]').textContent='Alterações salvas e auditadas.';});}</script></body></html>
