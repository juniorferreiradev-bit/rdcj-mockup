<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RDCJ | Processo 360°</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="page-content process-grid"><a class="text-link" href="matriz.html">← Voltar para a matriz</a><section class="card explanation-card"><p class="page-kicker">Processo 360°</p><h1 class="page-title" data-title>Processo</h1><p class="section-caption" data-client></p><div class="explanation-summary"><div><span class="metric-label">Quadrante</span><strong data-position></strong><p data-position-detail></p></div><div><span class="metric-label">Valor importado</span><strong data-value></strong><p>Campo de origem não editável.</p></div></div><h2 class="section-title">Por que este processo está neste quadrante?</h2><ul class="reason-list" data-reasons></ul><p class="future-module">Módulo de Risco de Perda e Potencial de Recuperação previsto para evolução futura.</p><a class="button" data-edit href="editar-processo.html">Editar Processo</a></section><section class="card explanation-card"><h2 class="section-title">Histórico de auditoria</h2><ol class="trace-list" data-history></ol></section></main><script src="../js/matriz-criticidade.js"></script><script src="../js/matrix-engine.js"></script><script src="../js/auditoria.js"></script><script src="../js/base-manager.js"></script><script src="../js/processo-repository.js"></script><script src="../js/matrix-ui.js"></script><script>const id=new URLSearchParams(location.search).get('processo'); const item=rdcjMatrixUI.getPortfolio().find((processo)=>processo.cnj===id||processo.process===id); if(!item){document.querySelector('[data-title]').textContent='Processo não encontrado';}else{document.querySelector('[data-title]').textContent=`Processo ${item.cnj}`;document.querySelector('[data-client]').textContent=item.cliente;document.querySelector('[data-position]').textContent=`${item.quadrante} · ${item.peso}`;document.querySelector('[data-position-detail]').textContent=`Data da decisão: ${item.dataDecisao || 'não informada'} · Tempo: ${item.faixaTempo} · Faixa: ${item.faixaValor}`;document.querySelector('[data-value]').textContent=rdcjMatrixEngine.formatCurrency(item.value);document.querySelector('[data-reasons]').innerHTML=`<li>Data da decisão: ${item.dataDecisao || 'não informada'}</li><li>Tempo: ${item.faixaTempo}</li><li>Valor: ${rdcjMatrixEngine.formatCurrency(item.value)}</li><li>Faixa: ${item.faixaValor}</li><li>Quadrante: ${item.quadrante}</li><li>Peso: ${item.peso}</li>`.replaceAll('<li>','<li>');document.querySelector('[data-edit]').href=`editar-processo.html?cnj=${encodeURIComponent(item.cnj)}`;const eventos=rdcjAuditoria.listar().filter((evento)=>evento.cnj===item.cnj);document.querySelector('[data-history]').innerHTML=eventos.length?eventos.map((evento)=>`<li>${new Date(evento.data).toLocaleString('pt-BR')} · ${evento.tipo} · ${evento.detalhes || ''}</li>`).join(''):'<li>Nenhuma alteração registrada.</li>';}</script></body></html>
